name: Run Unittests

on:
  pull_request:
    branches:
      - dev
      - stage
      - prod

jobs:
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"

      # Set environment variables from secrets
      - name: Set environment variables
        run: |
          echo "TRACE_LOG=${{ secrets.TRACE_LOG }}" >> $GITHUB_ENV
          echo "MIN_TEXT_LENGTH=${{ secrets.MIN_TEXT_LENGTH }}" >> $GITHUB_ENV
          echo "MAX_TEXT_LENGTH=${{ secrets.MAX_TEXT_LENGTH }}" >> $GITHUB_ENV
          echo "DEFAULT_NUMBER_OF_RESULTS=${{ secrets.DEFAULT_NUMBER_OF_RESULTS }}" >> $GITHUB_ENV
          echo "MIN_NUMBER_OF_RESULTS=${{ secrets.MIN_NUMBER_OF_RESULTS }}" >> $GITHUB_ENV
          echo "MAX_NUMBER_OF_RESULTS=${{ secrets.MAX_NUMBER_OF_RESULTS }}" >> $GITHUB_ENV
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV
          echo "MONGODB_DATABASE=${{ secrets.MONGODB_DATABASE }}" >> $GITHUB_ENV
          echo "MONGODB_COLLECTION=${{ secrets.MONGODB_COLLECTION }}" >> $GITHUB_ENV
          echo "BEARER_TOKEN=${{ secrets.BEARER_TOKEN }}" >> $GITHUB_ENV

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run unittests
      - name: Run unittests
        run: |
          python -m unittest discover tests
